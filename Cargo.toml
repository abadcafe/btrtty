[package]
name = "btrtty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Expose a macOS PTY as a Bluetooth Classic Serial Port Profile service"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-io-bluetooth = "0.3.2"
pty-process = { version = "0.5.3", features = ["async"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
